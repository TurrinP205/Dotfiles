[colors]
transparent =#80808080 
background=#806A89A7
foreground=#ffffff
primary   =#ffffff
insane =#000000
secondary =#ffffff
alert    =#ffffff
disabled =#ffffff
[bar/escri]
width = 11%
height = 20
offset-x = 0.1%
offset-y =2
radius = 10
wm-restack = i3
background = ${colors.background}
foreground = ${colors.foreground}
#border-size = 2
#border-color =585858
modules-left = xworkspaces pulseaudio brillo
font-0 ="JetBrainsMono Nerd Font:size=10;2"
padding = 0
module-margin = 1
override-redirect = true
enable-ipc = true

[bar/exemple]
width = 7%
height = 20
offset-x = 45%
offset-y =1
radius=10
fixed-center = true
override-redirect = true
wm-restack = i3
background = ${colors.background}
foreground = ${colors.foreground}
#border-size = 2
#border-color = #4682B4
padding = 2
module-margin = 0
font-0 = ""JetBrainsMono Nerd Font:style=Bold:size=10;2""
modules-center = date
enable-ipc = true

[bar/top]
width = 31%
height = 20
offset-x = 69%
offset-y = 2
radius = 10 
override-redirect = true
wm-restack = i3
background = ${colors.background}
foreground = ${colors.foreground}
#border-size = 2
#border-color = #4682B4
padding-left = 0
padding-right = 0
module-margin = 1
font-0 = "JetBrainsMono Nerd Font:size=10;2"
modules-center = cpu-temp cpu memory network battery
enable-ipc = true 

[module/network]
type = internal/network
interface = wlp3s0
label-connected = " %essid% "
label-connected-foreground = ${colors.primary}
label-disconnected = "󰖪"
label-disconnected-foreground = ${colors.alert}

[module/battery]
type = internal/battery
full-at = 100
low-at = 10
battery = BAT0
adapter = AC
poll-interval = 5
format-charging = <label-charging>
format-discharging = <label-discharging>
label-charging = "󰂄 %percentage%%"
label-charging-foreground = ${colors.primary}
label-discharging = "󰁹 %percentage%%"
label-full = "󰁹 %percentage%%"

[module/xworkspaces]
type = internal/xworkspaces

; Color de fondo transparente para la etiqueta activa
label-active = %name%
label-active-background = ${colors.transparent}
label-active-foreground = ${colors.white}

; Esto crea la línea blanca debajo (estilo minimalista)
label-active-underline = ${colors.white}

; Si quieres que TODO el bloque tenga un borde (cuadrado), 
; Polybar no permite bordes individuales por módulo fácilmente, 
; pero puedes usar el subrayado (underline) y el sobrelineado (overline):
label-active-overline = ${colors.white}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-empty = ""
label-empty-padding = 0
[module/date]
type = internal/date
interval = 1
date = %I:%M %p
label = %date%
label-foreground = ${colors.secondary}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[settings]
screenchange-reload = true
pseudo-transparency = true

[module/brillo]
type = internal/backlight
card = amdgpu_bl1
enable-scroll = true
format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = "󰖨 "

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = ""
label-muted = "󰸈"
label-muted-foreground = ${colors.disabled}

[module/cpu-temp]
type = internal/temperature
interval = 0.5
thermal-zone = 0
base-temperature = 40
warn-temperature = 70
format = <label>
label = %temperature-c%
label-foreground = ${colors.primary}
format-warn = <label-warn>
format-prefix=""
label-warn = %temperature-c%!
label-warn-foreground = ${colors.alert}
